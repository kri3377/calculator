<main class="calc"><h1><span class="br"><span class="nm">Calc<em>991</em></span><small>NATURAL SCIENTIFIC</small></span><button id="snd" class="tg" role="switch" aria-checked="false" aria-label="Typing sound" title="Typing sound">♪<i></i></button></h1>
<section class="lcd"><div class="st" id="st"></div><div class="ex" id="ex"></div><div class="rs" id="rs"></div></section>
<div id="pad"></div><div class="ov" id="ov"></div><div class="hp" id="hp"></div></main>
<script>
const $=id=>document.getElementById(id);
const V={A:0,B:0,C:0,D:0,E:0,F:0,X:0,Y:0,M:0,Ans:0};
let ex="",pos=0,sh=0,al=0,mode="Deg",ov=0,fresh=0,res=null,lab="",msg="",dec=0,mixed=0,engK=null,pend=null,cb="",hyp=0,pm=null,hist=[],hi=-1;
const FN=["sinh⁻¹(","cosh⁻¹(","tanh⁻¹(","sin⁻¹(","cos⁻¹(","tan⁻¹(","sinh(","cosh(","tanh(","sin(","cos(","tan(","log(","logₐ(","ln(","³√(","√(","Abs(","e^(","10^(","∫(","d/dx(","Σ(","Pol(","Rec(","RanInt(","Rnd("];

const C=[["mp",1.672621777e-27],["mn",1.674927351e-27],["me",9.10938291e-31],["mμ",1.883531475e-28],["a0",5.2917721092e-11],["h",6.62606957e-34],["μN",5.05078353e-27],["μB",9.27400968e-24],["ħ",1.054571726e-34],["α",7.2973525698e-3],["re",2.8179403267e-15],["λc",2.4263102389e-12],["γp",2.675222005e8],["λcp",1.32140985623e-15],["λcn",1.31959090468e-15],["R∞",10973731.568539],["u",1.660538921e-27],["μp",1.410606743e-26],["μe",-9.2847643e-24],["μn",-9.6623647e-27],["μμ",-4.49044807e-26],["F",96485.3365],["e",1.602176565e-19],["NA",6.02214129e23],["k",1.3806488e-23],["Vm",2.2710953e-2],["R",8.3144621],["C0",299792458],["C1",3.74177153e-16],["C2",1.438777e-2],["σ",5.670373e-8],["ε0",8.854187817e-12],["μ0",1.256637061e-6],["φ0",2.067833758e-15],["g",9.80665],["G0",7.7480917346e-5],["Z0",376.730313461],["t",273.15],["G",6.67384e-11],["atm",101325]];
const toE=v=>String(v).replace(/e\+?(-?\d+)/,"×10^($1)").replace(/-/g,"−");
// ---------- maths ----------
const ok=v=>{if(typeof v!=="number"||!isFinite(v))throw 1;return v};
const z=v=>Math.abs(v)<1e-14?0:v;
function fact(n){if(!Number.isInteger(n)||n<0||n>69)throw 1;let r=1;for(let i=2;i<=n;i++)r*=i;return r}
const T={"sin(":(x,k)=>z(Math.sin(x*k)),"cos(":(x,k)=>z(Math.cos(x*k)),"tan(":(x,k)=>{if(Math.abs(Math.cos(x*k))<1e-12)throw 1;return z(Math.tan(x*k))},
"sin⁻¹(":(x,k)=>Math.asin(x)/k,"cos⁻¹(":(x,k)=>Math.acos(x)/k,"tan⁻¹(":(x,k)=>Math.atan(x)/k,
"sinh(":Math.sinh,"cosh(":Math.cosh,"tanh(":Math.tanh,"sinh⁻¹(":Math.asinh,"cosh⁻¹(":Math.acosh,"tanh⁻¹(":Math.atanh,
"log(":Math.log10,"ln(":Math.log,"√(":Math.sqrt,"³√(":Math.cbrt,"Abs(":Math.abs,"e^(":Math.exp,"10^(":x=>10**x,"Rnd(":x=>+x.toPrecision(10)};
const M2={"logₐ(":(a,b)=>Math.log(b)/Math.log(a),"Pol(":(x,y,k)=>{V.Y=Math.atan2(y,x)/k;return Math.hypot(x,y)},
"Rec(":(r,t,k)=>{V.Y=r*Math.sin(t*k);return r*Math.cos(t*k)},"RanInt(":(a,b)=>a+Math.floor(Math.random()*(b-a+1))};
function asr(f,a,b,e,w,fa,fm,fb,d){const m=(a+b)/2,lm=(a+m)/2,rm=(m+b)/2,fl=f(lm),fr=f(rm),l=(m-a)/6*(fa+4*fl+fm),r=(b-m)/6*(fm+4*fr+fb);
 if(d<=0||Math.abs(l+r-w)<=15*e)return l+r+(l+r-w)/15;return asr(f,a,m,e/2,l,fa,fl,fm,d-1)+asr(f,m,b,e/2,r,fm,fr,fb,d-1)}
function integ(f,a,b){if(a===b)return 0;const fa=f(a),fb=f(b),fm=f((a+b)/2);return asr(f,a,b,1e-10,(b-a)/6*(fa+4*fm+fb),fa,fm,fb,40)}
const tok=s=>{const t=[];for(let i=0;i<s.length;){const r=s.slice(i),m=r.match(/^(\d+\.?\d*|\.\d+)/);
 if(m){t.push({n:parseFloat(m[1])});i+=m[1].length;continue}
 const f=ALL.find(x=>r.startsWith(x));if(f){t.push({f});i+=f.length;continue}t.push({c:r[0]});i++}return t};
function parse(s){const t=tok(s);let p=0;
 const isC=c=>t[p]&&t[p].c===c,isF=f=>t[p]&&t[p].f===f;
 const K=()=>mode==="Deg"?Math.PI/180:mode==="Gra"?Math.PI/200:1,U=()=>mode==="Deg"?1:mode==="Gra"?10/9:Math.PI/180;
 const g=f=>x=>{const o=V.X;V.X=x;try{return f()}finally{V.X=o}};
 const startP=()=>{const x=t[p];return x&&(x.n!==undefined||(x.f&&(x.f.endsWith("(")||x.f==="Ans"||x.f==="Ran#"))||(x.c&&"(πeABCDEFXYM".includes(x.c)))};
 function expr(){let a=term();while(isC("+")||isC("−")){const o=t[p++].c,b=term(),l=a;a=o==="+"?()=>l()+b():()=>l()-b()}return a}
 function term(){let a=perm();for(;;){let o=null;if(isC("×")||isC("÷"))o=t[p++].c;else break;
  const l=a,b=perm();a=o==="÷"||o==="⁄"?()=>{const d=b();if(d===0)throw 1;return l()/d}:()=>l()*b()}return a}
 function imp(){let a=fr();while(startP()){const l=a,b=fr();a=()=>l()*b()}return a}
 function fr(){let a=un();while(isC("⁄")){p++;const l=a,b=un();a=()=>{const d=b();if(d===0)throw 1;return l()/d}}return a}
 function perm(){let a=imp();while(isF("nPr")||isF("nCr")){const o=t[p++].f,l=a,b=imp();
  a=()=>{const n=l(),r=b();if(!Number.isInteger(n)||!Number.isInteger(r)||r<0||r>n)throw 1;let v=1;for(let i=0;i<r;i++)v*=n-i;return o==="nPr"?v:v/fact(r)}}return a}
 function un(){if(isC("−")){p++;const u=un();return()=>-u()}if(isC("+")){p++;return un()}return pw()}
 function pw(){const b=po();if(isC("^")){p++;const e=un();return()=>Math.pow(b(),e())}
  if(isF("ʸ√")){p++;const e=un();return()=>Math.pow(e(),1/b())}return b}
 function po(){let a=atom();for(;;){const l=a;
  if(isC("!")){p++;a=()=>fact(l())}else if(isC("%")){p++;a=()=>l()/100}else if(isC("²")){p++;a=()=>l()**2}
  else if(isC("³")){p++;a=()=>l()**3}else if(isF("⁻¹")){p++;a=()=>{const d=l();if(d===0)throw 1;return 1/d}}else break}return a}
 function call(f,a){
  if(f==="∫(")return()=>integ(g(a[0]),a[1](),a[2]());
  if(f==="d/dx(")return()=>{const F=g(a[0]),x=a[1](),h=1e-3*Math.max(1,Math.abs(x));return(8*(F(x+h)-F(x-h))-(F(x+2*h)-F(x-2*h)))/(12*h)};
  if(f==="Σ(")return()=>{const F=g(a[0]);let s=0;const lo=a[1](),hi=a[2]();for(let i=lo;i<=hi;i++)s+=F(i);return s};
  if(M2[f])return()=>ok(M2[f](a[0](),a[1](),K()));
  return()=>ok(T[f](a[0](),K()))}
 function atom(){const x=t[p++];if(!x)throw 2;
  if(x.n!==undefined){let d=x.n;if(isC("°")){p++;if(t[p]&&t[p].n!==undefined&&t[p+1]&&t[p+1].c==="′"){d+=t[p].n/60;p+=2}return()=>d*U()}return()=>d}
  if(x.f==="Ans")return()=>V.Ans;if(x.f==="Ran#")return()=>+Math.random().toFixed(3);
  if(x.f&&x.f.endsWith("(")){const a=[expr()];while(isC(",")){p++;a.push(expr())}if(isC(")"))p++;return call(x.f,a)}
  if(x.c==="("){const a=expr();if(isC(")"))p++;return a}
  if(x.c==="π")return()=>Math.PI;if(x.c==="e")return()=>Math.E;
  if(x.c&&VARS.includes(x.c))return()=>V[x.c];

const run=s=>ok(parse(s)());
// ---------- display formats ----------
const dpl=v=>{let s=String(+v.toPrecision(10));if(/e/.test(s))s=s.replace(/e\+?(-?\d+)/,"×10^($1)");return s.replace(/-/g,"−")};
function frac(x,md){let h1=1,h0=0,k1=0,k0=1,b=x;for(let i=0;i<30;i++){const a=Math.floor(b);[h1,h0]=[a*h1+h0,h1];[k1,k0]=[a*k1+k0,k1];
 if(Math.abs(x-h1/k1)<1e-11)return[h1,k1];if(k1>md)return null;b=1/(b-a);if(!isFinite(b))return null}return null}
function exact(v){if(Number.isInteger(v)||!isFinite(v)||Math.abs(v)<1e-9||Math.abs(v)>1e5||Math.abs(v-Math.round(v))<1e-9)return null;const s=v<0?"−":"",x=Math.abs(v);
 let f=frac(x,10000);
 if(f&&f[1]>1){const[n,d]=f;return mixed&&n>d?`${s}${Math.floor(n/d)} ${n%d}⁄${d}`:`${s}${n}⁄${d}`}
 f=frac(x/Math.PI,1000);if(f&&f[1]<=100&&f[0]<=1000)return`${s}${f[0]>1?f[0]:""}π${f[1]>1?"⁄"+f[1]:""}`;
 const q=frac(x*x,10000);if(q&&q[1]<=100){const n=q[0]*q[1],d=q[1];let k=1;for(let i=2;i*i<=n;i++)if(n%(i*i)===0)k=i;
  const r=n/(k*k);if(r<2)return null;return`${s}${k>1?k:""}√${r}${d>1?"⁄"+d:""}`.replace(/√(\d+)⁄(\d+)/,"√$1⁄$2")}
 return null}
// ---------- editing ----------
const START=["+","−","×","÷","^","²","³","⁻¹","⁄","nPr","nCr","!","%","ʸ√"];
function ins(s){
 if(hyp&&/^(sin|cos|tan)/.test(s)){s=s.replace(/^(sin|cos|tan)/,"$1h");hyp=0}
 if(fresh){ex=START.some(o=>s.startsWith(o))?"Ans":"";pos=ex.length;fresh=0;res=null;lab=""}
 if(ov&&pos<ex.length)ex=ex.slice(0,pos)+ex.slice(pos+1);
 ex=ex.slice(0,pos)+s+ex.slice(pos);pos+=s.length}
const edit=()=>{if(fresh){fresh=0;res=null;lab=""}};
const cur=()=>res!==null?res:run(ex);
const A={
 shift(){sh=!sh;al=0},alpha(){al=!al;sh=0},
 left(){edit();const f=ALL.find(x=>ex.slice(0,pos).endsWith(x));pos=Math.max(0,pos-(f?f.length:1))},
 right(){edit();const f=ALL.find(x=>ex.slice(pos).startsWith(x));pos=Math.min(ex.length,pos+(f?f.length:1))},
 up(){if(!hist.length)return;hi=Math.min(hi+1,hist.length-1);ex=hist[hi];pos=ex.length;fresh=0;res=null;lab=""},
 down(){if(hi<0)return;hi--;ex=hi>=0?hist[hi]:"";pos=ex.length;fresh=0;res=null;lab=""},
 del(){edit();const f=ALL.find(x=>ex.slice(0,pos).endsWith(x)),n=f?f.length:1;if(pos===0)return;ex=ex.slice(0,pos-n)+ex.slice(pos);pos-=n},
 ins(){ov=!ov},
 ac(){ex="";pos=0;res=null;lab="";fresh=0;pm=null;hyp=0;pend=null;cb="";engK=null;msg=""},
 on(){Object.keys(V).forEach(k=>V[k]=0);hist=[];mode="Deg";A.ac()},
 clr(){["A","B","C","D","E","F","X","Y","M"].forEach(k=>V[k]=0);A.ac();msg="Memory cleared"},
 drg(){mode={Deg:"Rad",Rad:"Gra",Gra:"Deg"}[mode]},
 hyp(){hyp=!hyp},sto(){pend="sto"},rcl(){pend="rcl"},
 const(){pend="const";cb=""},
 sd(){if(res!==null){dec=!dec;engK=null}},mixed(){mixed=!mixed},
 eng(){if(res===null||!res)return;engK=engK===null?Math.floor(Math.log10(Math.abs(res))/3):engK+1},
 engb(){if(res===null||!res)return;engK=(engK===null?Math.floor(Math.log10(Math.abs(res))/3):engK)-1},
 mplus(){try{V.M+=cur()}catch{msg="Math ERROR"}},mminus(){try{V.M-=cur()}catch{msg="Math ERROR"}},

  try{const v=run(ex);V.Ans=v;res=v;lab="";hist.unshift(ex);hist=hist.slice(0,30);hi=-1;fresh=1}catch(e){msg=e===1?"Math ERROR":"Syntax ERROR";res=null}},
 calc(){if(!ex||pm)return;const n=[...new Set(tok(ex).filter(x=>x.c&&VARS.includes(x.c)).map(x=>x.c))];
  if(!n.length)return ex.includes("=")?(msg="Syntax ERROR"):A.eq();pm={vars:n,i:0,src:ex,solve:0};ex="";pos=0;res=null},
